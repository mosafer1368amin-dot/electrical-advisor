<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background of the App Icon -->
  <rect width="100%" height="100%" fill="#090d16" rx="112"/>
  
  <!-- Outer Dotted Technical/Electrical Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="16 12" opacity="0.5"/>
  
  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)"/>
  
  <!-- Main inner circular badge -->
  <circle cx="256" cy="256" r="135" fill="url(#circleGrad)" stroke="#f59e0b" stroke-width="4"/>
  
  <!-- Lightning Bolt Vector -->
  <path d="M280 120 L165 285 L245 285 L232 392 L347 227 L267 227 Z" fill="url(#boltGrad)" filter="drop-shadow(0px 0px 14px rgba(251, 191, 36, 0.85))"/>
</svg>
